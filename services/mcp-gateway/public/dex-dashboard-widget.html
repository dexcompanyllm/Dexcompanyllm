<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dex Company</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: var(--font-sans, Inter, Pretendard, system-ui, sans-serif);
      --dex-safe-top: env(safe-area-inset-top, 0px);
      --dex-safe-right: env(safe-area-inset-right, 0px);
      --dex-safe-bottom: env(safe-area-inset-bottom, 0px);
      --dex-safe-left: env(safe-area-inset-left, 0px);
    }
    body {
      margin: 0;
      padding:
        calc(16px + var(--dex-safe-top))
        calc(16px + var(--dex-safe-right))
        calc(16px + var(--dex-safe-bottom))
        calc(16px + var(--dex-safe-left));
      background: transparent;
      color: var(--color-text-primary, CanvasText);
    }
    .shell { display: grid; gap: 14px; }
    .hero { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .hero h1 { font-size: 18px; margin: 0; }
    .hero p { margin: 4px 0 0; opacity: .7; font-size: 13px; }
    button {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid var(--color-border-primary, color-mix(in srgb, CanvasText 20%, transparent));
      border-radius: var(--border-radius-md, 10px);
      padding: 9px 12px;
      background: var(--color-background-secondary, Canvas);
      color: var(--color-text-primary, CanvasText);
      cursor: pointer;
      touch-action: manipulation;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 10px; }
    .card { border: 1px solid var(--color-border-primary, color-mix(in srgb, CanvasText 14%, transparent)); border-radius: var(--border-radius-lg, 14px); padding: 12px; }
    .card h2 { font-size: 14px; margin: 0 0 8px; }
    .card p, .card li { font-size: 12px; line-height: 1.45; }
    ul { margin: 0; padding-left: 18px; }
    .empty { opacity: .65; }
    .badge { display: inline-flex; border-radius: 999px; padding: 3px 8px; font-size: 11px; background: color-mix(in srgb, CanvasText 8%, transparent); }
    @media (max-width: 480px) {
      body { padding-left: calc(12px + var(--dex-safe-left)); padding-right: calc(12px + var(--dex-safe-right)); }
      .hero { align-items: stretch; flex-direction: column; }
      #open-pwa { width: 100%; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div><h1>Dex Company</h1><p>GitHub-backed project and task control</p></div>
      <button id="open-pwa" type="button">PWA 열기</button>
    </section>
    <section class="grid">
      <article class="card"><h2>프로젝트</h2><div id="projects" class="empty">데이터 대기 중</div></article>
      <article class="card"><h2>진행 작업</h2><div id="tasks" class="empty">데이터 대기 중</div></article>
      <article class="card"><h2>Provider</h2><div id="providers" class="empty">데이터 대기 중</div></article>
    </section>
  </main>
  <script type="module">
    import {
      App,
      applyDocumentTheme,
      applyHostStyleVariables,
    } from "__DEX_MCP_APP_RUNTIME_URL__";

    let payload = window.openai?.toolOutput ?? null;
    const projectsNode = document.querySelector('#projects');
    const tasksNode = document.querySelector('#tasks');
    const providersNode = document.querySelector('#providers');
    const trustedPwaUrl = '__DEX_PWA_URL__';
    const trustedPwaOrigin = new URL(trustedPwaUrl).origin;
    let pwaUrl = trustedPwaUrl;
    let mcpConnected = false;
    const mcpApp = new App(
      { name: 'Dex Company Dashboard', version: '0.2.0' },
      {},
      { autoResize: true },
    );

    function list(items, render) {
      if (!Array.isArray(items) || !items.length) return '<span class="empty">없음</span>';
      return `<ul>${items.slice(0, 6).map(render).join('')}</ul>`;
    }

    function render(data) {
      if (!data) return;
      pwaUrl = safePwaUrl(data.pwaUrl || data.pwa) || pwaUrl;
      projectsNode.classList.remove('empty');
      tasksNode.classList.remove('empty');
      providersNode.classList.remove('empty');
      projectsNode.innerHTML = list(data.projects, p => `<li><strong>${escapeHtml(p.name)}</strong></li>`);
      tasksNode.innerHTML = list(data.tasks, t => `<li>${escapeHtml(t.title)} <span class="badge">${escapeHtml(t.state || 'open')}</span></li>`);
      providersNode.innerHTML = Object.entries(data.providers || {}).map(([name, value]) =>
        `<p><strong>${escapeHtml(name)}</strong><br>${escapeHtml(value?.worker || '')} · ${value?.subscriptionReady ? 'ready' : 'host check needed'}</p>`
      ).join('') || '<span class="empty">없음</span>';
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    function safePwaUrl(value) {
      try {
        const url = new URL(value);
        const local = url.protocol === 'http:' && ['localhost', '127.0.0.1', '::1'].includes(url.hostname);
        return (url.protocol === 'https:' || local) && url.origin === trustedPwaOrigin ? url.href : null;
      } catch {
        return null;
      }
    }

    function safeInset(value) {
      const number = Number(value);
      return Number.isFinite(number) ? Math.min(128, Math.max(0, number)) : 0;
    }

    function applyHostContext(context = {}) {
      const theme = context.theme ?? window.openai?.theme;
      const safeArea = context.safeAreaInsets ?? window.openai?.safeArea;
      if (theme === 'light' || theme === 'dark') applyDocumentTheme(theme);
      if (context.styles?.variables) applyHostStyleVariables(context.styles.variables);
      if (context.platform) document.documentElement.dataset.platform = context.platform;
      if (safeArea) {
        const root = document.documentElement.style;
        root.setProperty('--dex-safe-top', `${safeInset(safeArea.top)}px`);
        root.setProperty('--dex-safe-right', `${safeInset(safeArea.right)}px`);
        root.setProperty('--dex-safe-bottom', `${safeInset(safeArea.bottom)}px`);
        root.setProperty('--dex-safe-left', `${safeInset(safeArea.left)}px`);
      }
    }

    mcpApp.ontoolresult = result => {
      payload = result?.structuredContent ?? result?.content ?? null;
      render(payload);
    };
    mcpApp.onhostcontextchanged = context => applyHostContext(context);
    mcpApp.onteardown = async () => ({});

    window.addEventListener('message', event => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (message?.method === 'ui/notifications/tool-result') {
        payload = message.params?.structuredContent ?? message.params?.content ?? null;
        render(payload);
      }
    });

    document.querySelector('#open-pwa').addEventListener('click', async () => {
      if (mcpConnected) {
        try {
          const result = await mcpApp.openLink({ url: pwaUrl });
          if (!result?.isError) return;
        } catch {
          // The compatibility paths below keep navigation available on older hosts.
        }
      }
      if (window.openai?.openExternal) {
        await window.openai.openExternal({ href: pwaUrl });
      } else {
        window.open(pwaUrl, '_blank', 'noopener,noreferrer');
      }
    });

    applyHostContext();
    render(payload);
    mcpApp.connect().then(() => {
      mcpConnected = true;
      applyHostContext(mcpApp.getHostContext());
    }).catch(() => {
      document.documentElement.dataset.bridge = 'openai-fallback';
    });
  </script>
</body>
</html>
