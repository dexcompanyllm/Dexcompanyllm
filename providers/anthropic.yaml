schemaVersion: "1.0"
provider: "anthropic"
status: "enabled"

canonicalContract: "AI_CONTRACT.md"
authentication:
  mode: "claude-subscription"
  allowedModes:
    - "claude-account"
    - "claude-code-subscription"
  prohibitedModes:
    - "api-key"
  rejectEnvironmentVariables:
    - "ANTHROPIC_API_KEY"

costPolicy:
  subscriptionFirst: true
  paidApiAllowed: false
  automaticPaidFallback: false
  extraUsageAllowed: false
  quotaReachedAction: "checkpoint-and-failover-or-wait"

usagePolicy:
  profile: "quality-first"
  enforcement: "instruction-only"
  appliesWhenExecutionProvider: "anthropic"
  dexInputTokenCap: null
  dexOutputTokenCap: null
  dexReasoningTokenCap: null
  inheritOpenAIPlusEfficient: false
  reduceQualityForTokenSavings: false
  contextPolicy: "task-relevant-expand-for-evidence-and-validation"
  completionBoundary: "acceptance-criteria-or-verified-blocker"
  providerLimitsAction: "respect-provider-and-workspace-limits"
  receivingClaudeValidation: "Not Checked"

surfaces:
  reasoning:
    preferred: "claude"
  repositoryExecution:
    preferred: "claude-code"
  nonInteractiveWorker:
    preferred: "claude-p"
  remoteMcp:
    preferred: "claude-custom-connector"

modelRouting:
  discovery: "runtime-or-current-provider-config"
  policies:
    planning:
      preferredClass: "strongest-reasoning-available"
    writing:
      preferredClass: "strongest-writing-available"
    complexRepositoryWork:
      preferredClass: "strongest-coding-available"
    review:
      preferredClass: "independent-review-capable"
  missingPreferredModelAction: "fallback-by-capability-and-record"

platformConstraints:
  remoteMcpPublicEndpointRequired: true
  remoteMcpAcrossClaudeClients: true
  localMcpDesktopOnly: true
  subscriptionPolicyMustBeRecheckedAtRuntime: true
  fallbackFrontDoor: "https://dexcompany.app"

capabilities:
  - "research-web"
  - "analyze-documents"
  - "write-markdown"
  - "edit-repository"
  - "run-shell"
  - "run-tests"
  - "github-read"
  - "github-write"
  - "approval-request"

notes:
  - "Claude Agent SDK와 claude -p의 구독 차감 정책은 변경 가능성이 있어 worker 시작 전에 공식 정책을 확인한다."
  - "ANTHROPIC_API_KEY가 감지되면 예상치 못한 API 청구를 막기 위해 worker를 중지한다."
