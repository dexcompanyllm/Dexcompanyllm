schemaVersion: "1.0"
provider: "openai"
status: "enabled"

canonicalContract: "AI_CONTRACT.md"
authentication:
  mode: "chatgpt-managed"
  allowedModes:
    - "chatgpt"
    - "chatgptDeviceCode"
  prohibitedModes:
    - "apiKey"
  rejectEnvironmentVariables:
    - "OPENAI_API_KEY"

costPolicy:
  subscriptionFirst: true
  paidApiAllowed: false
  automaticPaidFallback: false
  quotaReachedAction: "checkpoint-and-failover-or-wait"
  automaticCreditPurchase: false
  planTransitionGuard:
    pro200NewSubscriptions:
      status: "confirmed-temporary-pause"
      effectiveDate: "2026-09-10"
      exactEffectiveTime: "unpublished"
      affectedTargetPlans:
        - "pro-200"
        - "pro-20x"
      affectedTransitions:
        - "new-signup"
        - "upgrade-from-free-go-plus-or-pro-100"
      existingPro200RenewalAffected: false
      pro100Affected: false
      scheduledCancelOrDowngradeEffectiveAt: "current-billing-cycle-end"
      undoBeforeCycleEnd: true
      oneTimeReturnWindow: "up-to-30-days-after-pro-200-access-ends-when-account-is-eligible"
      oneTimeReturnEligibility: "account-specific; official-help-criteria-and-account-pricing-ui-control"
      automaticCancelOrDowngradeAllowed: false
      automaticRepurchaseAllowed: false
      preChangeAction: "warn-recheck-official-help-and-account-billing-ui"
      actualAccountPlan: "Not Checked"
      actualBillingCycleEnd: "Not Checked"
      actualReturnEligibility: "Not Checked"
      sources:
        - "https://help.openai.com/en/articles/9793128-about-chatgpt-pro-tiers"
        - "https://help.openai.com/en/articles/7232927-canceling-your-chatgpt-subscription"
  purchasedCreditPromotions:
    gpt56Sol:
      status: "confirmed-temporary"
      guaranteedThroughAtLeast: "2026-11-21"
      exactEndTime: "unpublished"
      appliesTo: "eligible-usage-paid-with-purchased-credits"
      includedUsageChanged: false
      prebuyRecommended: false
      source: "https://learn.chatgpt.com/docs/pricing"

surfaces:
  reasoning:
    preferred: "chatgpt"
  longFormArtifact:
    preferred: "work"
  microsoftWordAddin:
    status: "confirmed-available"
    announcedDate: "2026-09-17"
    exactAnnouncementTime: "unpublished"
    plans:
      - "free"
      - "go"
      - "plus"
      - "pro"
      - "business"
      - "enterprise"
      - "edu"
    usageAllowance: "shared-with-codex-and-other-premium-features"
    planTokenLimitsApply: true
    supportedClients: "not-published-by-openai"
    canonicalTaskStateAuthority: false
    automaticInstallAllowed: false
    actualInstallation: "Not Checked"
    actualAccountAvailability: "Not Checked"
    source: "https://help.openai.com/en/articles/6825453-chatgpt-release-notes"
  pluginMultiAccount:
    status: "confirmed-available"
    announcedDate: "2026-09-17"
    exactAnnouncementTime: "unpublished"
    plans: "all-chatgpt-plans"
    surfaces:
      - "web"
      - "mobile"
      - "desktop"
    automaticConnectionAllowed: false
    automaticCrossAccountMixingAllowed: false
    taskAccountScopeConfirmationRequired: true
    actualConnectedAccounts: "Not Checked"
    source: "https://help.openai.com/en/articles/6825453-chatgpt-release-notes"
  librarySharedFolders:
    status: "confirmed-available"
    effectiveDate: "2026-09-09"
    exactEffectiveTime: "unpublished"
    uploadedFileOwner: "shared-folder-owner"
    uploaderIdentityRecorded: true
    uploaderMayLoseAccessAfterFolderAccessRemoval: true
    canonicalStorageAllowed: false
    canonicalOrSensitiveUploadToAnotherOwnersFolderAllowed: false
    actualAccountAvailability: "Not Checked"
    source: "https://help.openai.com/en/articles/6825453-chatgpt-release-notes"
  repositoryExecution:
    preferred: "codex-app-server"
  fastTargetedEdit:
    preferred: "codex"

modelRouting:
  discovery: "runtime"
  refreshBeforeHighImpactTask: true
  planAwareProfile:
    scope: "authenticated-codex-app-server-worker-only"
    authority: "runtime-account-read-and-authenticated-model-catalog"
    implementation: "https://github.com/ethanhee890-commits/ethanhee890-commits-dex-company-runtime/pull/240"
    receipt: "10_Projects/DexCompany-Ops/CHATGPT_PLUS_EFFICIENT_PROFILE_20260919.md"
    confirmedPlus: "plus-efficient"
    unknownOrOtherPlan: "balanced"
    precedence: "runtime-plan-profile-before-generic-preferred-class"
    explicitTaskModelAndEffort: "preserve-and-validate-with-existing-runtime-gates"
    chatOrWorkAutomaticModelSwitch: false
    actualPlusHostE2E: "Not Checked"
  chatProAllowance:
    scope: "chat-only"
    separateFromWorkAndCodex: true
    source: "https://help.openai.com/en/articles/20001354-gpt-56-and-gpt-6-pro-in-chatgpt"
    planAndRemainingUsageSource: "official-docs-plus-account-usage-ui"
    planUnknownAction: "treat-pro-model-pool-as-scarce"
    modelSwitchResetsOrIncreasesPublishedAllowance: false
    routineAndComplexAction: "use-instant-or-thinking-before-pro"
    proEscalationAction: "critical-or-recorded-validation-failure-only"
  codexAstraHostGate:
    model: "gpt-6-astra"
    scope: "codex-cli-execution-host-only"
    officialSource: "https://learn.chatgpt.com/docs/changelog"
    minimumStableCliVersion: "0.153.0"
    cliVersionEvidence: "execution-host-codex---version"
    modelAvailabilityEvidence: "authenticated-model-list"
    prereleaseSatisfiesGate: false
    belowMinimumAction: "use-gpt-5.6-sol-or-checkpoint"
    automaticInstallAllowed: false
    automaticPaidFallbackAllowed: false
    accessDeviceDoesNotSatisfyHostGate: true
    runtimeImplementation: "https://github.com/ethanhee890-commits/ethanhee890-commits-dex-company-runtime/pull/233"
  policies:
    planning:
      preferredClass: "strongest-reasoning-available"
      reasoningEffort: "high-or-ultra"
    artifactAuthoring:
      preferredClass: "strongest-artifact-capable"
      reasoningEffort: "high-or-ultra"
    complexRepositoryWork:
      preferredClass: "strongest-codex-capable"
      reasoningEffort: "high"
    fastTargetedEdit:
      preferredClass: "fast-codex-capable"
      reasoningEffort: "low-or-medium"
    review:
      preferredClass: "independent-review-capable"
      reasoningEffort: "high"
  missingPreferredModelAction: "fallback-by-capability-and-record"

platformConstraints:
  customMcpMobile: false
  customMcpWriteOnPro: false
  customMcpReadOnProWeb: true
  localWorkRequiresDesktopHost: true
  codexRemoteRequiresConnectedHost: true
  fallbackFrontDoor: "https://dexcompany.app"

capabilities:
  - "research-web"
  - "analyze-documents"
  - "write-markdown"
  - "create-pptx"
  - "create-docx"
  - "create-xlsx"
  - "edit-repository"
  - "run-shell"
  - "run-tests"
  - "github-read"
  - "github-write"
  - "approval-request"

notes:
  - "현재 모델 ID는 Runtime discovery 결과와 에던의 품질 선호에 따라 adapter 운영 설정에서 별도 지정한다."
  - "Canonical role 문서에는 모델 ID를 저장하지 않는다."
  - "Chat의 Pro 모델 허용량은 Work/Codex 허용량과 분리해 판정하고, 실제 플랜과 남은 양은 행동 직전 Usage UI에서 확인한다."
  - "Astra의 CLI 0.153.0 Gate는 실제 Codex 실행 host에만 적용한다. Galaxy/Android, iPhone/iOS, ChatGPT Web 접속 여부와 다른 모델 경로를 전역 차단하지 않는다."
