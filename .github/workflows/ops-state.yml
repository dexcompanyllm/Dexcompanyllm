name: Wiki operations consistency
on:
  push:
    branches: [main, 'fix/ops-current-state-sync-20260906']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/ops-state.test.mjs
      - run: node scripts/ops-state.mjs
      - run: node --test scripts/data-catalog.test.mjs
      - run: node scripts/data-catalog.mjs
